services:
  - type: web
    name: osm-bs-sector-bot
    runtime: docker
    autoDeployTrigger: commit
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_USER_IDS
        sync: false
      - key: DEFAULT_RADIUS_KM
        value: "15"
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: USER_DB_PATH
        value: "/tmp/dugazhtbot-users.db"
      - key: DUGA_COLD_START_NOTICE
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
