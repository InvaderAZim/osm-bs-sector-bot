<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Вибір точки БС</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { background: #111827; }
    #map { height: calc(100% - 86px); }
    .panel { height: 86px; box-sizing: border-box; padding: 9px 12px; background: #111827; color: white; }
    .coords { font-size: 13px; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button { width: 100%; height: 44px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; background: #ef4444; color: white; }
    button:disabled { opacity: .55; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div class="coords" id="coords">Натисніть на будь-яку точку карти</div>
    <button id="send" disabled>✅ Підтвердити точку</button>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const map = L.map('map').setView([50.2547, 28.6587], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let selected = null;
    const coords = document.getElementById('coords');
    const send = document.getElementById('send');

    function choose(lat, lon) {
      selected = {lat: Number(lat.toFixed(7)), lon: Number(lon.toFixed(7))};
      if (!marker) marker = L.marker([lat, lon], {draggable: true}).addTo(map);
      else marker.setLatLng([lat, lon]);
      coords.textContent = `${selected.lat}, ${selected.lon}`;
      send.disabled = false;
    }

    map.on('click', e => choose(e.latlng.lat, e.latlng.lng));
    map.on('locationfound', e => { choose(e.latlng.lat, e.latlng.lng); map.setView(e.latlng, 16); });
    map.locate({setView: false, maxZoom: 16});

    send.addEventListener('click', () => {
      if (!selected) return;
      tg.sendData(JSON.stringify({type: 'map_point', ...selected}));
      tg.close();
    });
  </script>
</body>
</html>
