name: DUGA CI

on:
  push:
    branches: [main, cloudflare-worker]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-smoke:
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify dependency graph
        run: pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import production application
        env:
          TELEGRAM_BOT_TOKEN: "123456789:TEST_TOKEN_FOR_IMPORT_ONLY"
          PUBLIC_BASE_URL: "https://example.invalid"
          MAP_SECRET: "ci-only-map-secret-not-used-in-production"
          ADMIN_TELEGRAM_USER_IDS: "1"
          USER_DB_PATH: "/tmp/duga-ci.sqlite3"
          DUGA_COLD_START_NOTICE: "false"
        run: python -c "import entrypoint; assert entrypoint.api is not None; print('DUGA import OK')"

  cloudflare-smoke:
    if: github.ref_name == 'cloudflare-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Worker syntax
        run: npm run check

      - name: Run Worker behavior tests
        run: npm test

      - name: Bundle Worker with Wrangler
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi
          npx wrangler deploy

      - name: Verify live map layers
        if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-worker'
        run: |
          sleep 3
          for layer in standard topo hot; do
            file="/tmp/duga-map-tile-$layer"
            curl --fail --silent --show-error --retry 4 --retry-delay 2 \
              -o "$file" \
              "https://osm-bs-sector-bot.kraplenii.workers.dev/tiles/$layer/11/1186/692.png"
            test -s "$file"
            bytes=$(wc -c < "$file")
            if [ "$bytes" -lt 1000 ]; then
              echo "::error::Live $layer map tile is unexpectedly small: $bytes bytes"
              exit 1
            fi
            echo "Live $layer map tile OK: $bytes bytes"
          done
