name: DUGA CI

on:
  push:
    branches: [main, cloudflare-worker]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-smoke:
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify dependency graph
        run: pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import production application
        env:
          TELEGRAM_BOT_TOKEN: "123456789:TEST_TOKEN_FOR_IMPORT_ONLY"
          PUBLIC_BASE_URL: "https://example.invalid"
          MAP_SECRET: "ci-only-map-secret-not-used-in-production"
          ADMIN_TELEGRAM_USER_IDS: "1"
          USER_DB_PATH: "/tmp/duga-ci.sqlite3"
          DUGA_COLD_START_NOTICE: "false"
        run: python -c "import entrypoint; assert entrypoint.api is not None; print('DUGA import OK')"

  cloudflare-smoke:
    if: github.ref_name == 'cloudflare-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Worker syntax
        run: npm run check

      - name: Run Worker behavior tests
        run: npm test

      - name: Bundle Worker with Wrangler
        run: npx wrangler deploy --dry-run
