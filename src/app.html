<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DUGA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0f1117;--panel:#171a22;--card:#20242e;--text:#f4f6fb;--muted:#aeb5c4;--line:#343a46;--accent:#ef4444}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}.top{padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:grid;gap:8px}.title{display:flex;justify-content:space-between;align-items:center}.title b{font-size:18px}.title span{font-size:12px;color:var(--muted)}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}.search button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:var(--accent);color:#fff}#results{display:none;max-height:160px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}.result{padding:10px;border-bottom:1px solid var(--line);font-size:13px}.result:last-child{border-bottom:0}.result small{display:block;color:var(--muted);margin-top:3px}#map{flex:1;min-height:220px}.controls{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);display:grid;gap:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px;font-size:16px}.point-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.point-tabs button,.radii button,.common-polygon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 4px;font-weight:800}.point-tabs button.active{outline:2px solid #fff}.point-tabs button[data-i="0"].active{background:#b91c1c}.point-tabs button[data-i="1"].active{background:#1d4ed8}.point-tabs button[data-i="2"].active{background:#15803d}.point-tabs button.filled::after{content:' •';color:#fff}.radii{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.radii button.active{background:var(--accent);border-color:var(--accent);color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{background:var(--card);border:1px solid var(--line);color:var(--text)}.status{font-size:12px;color:var(--muted);min-height:16px}.sector-canvas{position:absolute;pointer-events:none}.point-icon{width:28px;height:28px;border-radius:50%;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 1px 8px rgba(0,0,0,.55)}.common-polygon-btn{width:100%}.common-polygon-btn.active{background:#a16207;border-color:#facc15;color:#fff}.fullscreen-btn{position:absolute;z-index:1000;right:10px;top:10px;border:1px solid rgba(255,255,255,.25);background:rgba(23,26,34,.92);color:#fff;border-radius:10px;padding:9px 11px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.35)}body.duga-fullscreen .top,body.duga-fullscreen .controls{display:none}body.duga-fullscreen #map{height:100vh;min-height:100vh}body.duga-fullscreen .fullscreen-btn{position:fixed;top:auto;right:12px;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 16px))}
</style>
</head>
<body>
<section class="top"><div class="title"><b>DUGA</b><span>До 3 секторів одночасно</span></div><div class="search"><input id="address" placeholder="Адреса у будь-якому форматі"><button id="searchBtn">Знайти</button></div><div id="results"></div></section>
<div id="map"><button id="fullscreenBtn" class="fullscreen-btn" type="button">⛶ На весь екран</button></div>
<section class="controls">
<div class="point-tabs" id="pointTabs"><button data-i="0" class="active">Точка 1</button><button data-i="1">Точка 2</button><button data-i="2">Точка 3</button></div>
<div class="grid"><div class="field"><label>Азимут активної точки, 0–359°</label><input id="azimuth" type="number" min="0" max="359" step="1" value="0"></div><div class="field"><label>Координати активної точки</label><input id="coords" readonly value="Натисніть на карту"></div></div>
<div class="radii" id="radii"><button data-r="1">1 км</button><button data-r="3" class="active">3 км</button><button data-r="5">5 км</button><button data-r="10">10 км</button></div>
<div class="actions"><button id="clearBtn" class="btn secondary">Очистити точку</button><button id="fitBtn" class="btn">Показати всі</button></div>
<button id="commonPolygonBtn" class="common-polygon-btn" type="button">⬡ Спільний полігон</button>
<div class="status" id="status">Точка 1: натисніть на карту або знайдіть адресу.</div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#171a22');tg.setBackgroundColor('#0f1117')}catch(e){}}
const map=L.map('map',{zoomControl:true}).setView([50.2547,28.6587],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.createPane('sectorPane');map.getPane('sectorPane').style.zIndex='350';map.getPane('sectorPane').style.pointerEvents='none';
const R=6371008.8,rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;function dest(lat,lon,bearing,distance){const p1=rad(lat),l1=rad(lon),t=rad((bearing%360+360)%360),d=distance/R,p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(t)),l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return L.latLng(deg(p2),((deg(l2)+540)%360)-180)}
const COLORS=[{css:'#dc2626',rgb:'220,38,38'},{css:'#2563eb',rgb:'37,99,235'},{css:'#16a34a',rgb:'22,163,74'}],points=[0,1,2].map(i=>({lat:null,lon:null,bearing:0,radiusKm:3,marker:null,sector:null,color:COLORS[i]}));let activeIndex=0;
const coords=document.getElementById('coords'),az=document.getElementById('azimuth'),status=document.getElementById('status'),results=document.getElementById('results');
function pointIcon(i){return L.divIcon({className:'',html:`<div class="point-icon" style="background:${points[i].color.css}">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
class SectorLayer extends L.Layer{constructor(cfg){super();this.cfg=cfg;this.draw=this.draw.bind(this)}onAdd(m){this.m=m;this.c=L.DomUtil.create('canvas','sector-canvas');m.getPane('sectorPane').appendChild(this.c);m.on('move zoom resize viewreset',this.draw);this.draw()}onRemove(m){m.off('move zoom resize viewreset',this.draw);L.DomUtil.remove(this.c)}draw(){const {lat,lon,bearing,distance,rgb}=this.cfg,s=this.m.getSize(),tl=this.m.containerPointToLayerPoint([0,0]);L.DomUtil.setPosition(this.c,tl);const q=Math.max(1,devicePixelRatio||1);this.c.style.width=s.x+'px';this.c.style.height=s.y+'px';this.c.width=s.x*q;this.c.height=s.y*q;const x=this.c.getContext('2d');x.setTransform(q,0,0,q,0,0);x.clearRect(0,0,s.x,s.y);const arc=[];for(let o=-60;o<=60;o+=2)arc.push(dest(lat,lon,bearing+o,distance));const cp=this.m.latLngToContainerPoint([lat,lon]),ap=arc.map(p=>this.m.latLngToContainerPoint(p)),rr=Math.hypot(...Object.values(this.m.latLngToContainerPoint(dest(lat,lon,bearing,distance)).subtract(cp)));x.save();x.beginPath();x.moveTo(cp.x,cp.y);ap.forEach(p=>x.lineTo(p.x,p.y));x.closePath();x.clip();const g=x.createRadialGradient(cp.x,cp.y,0,cp.x,cp.y,rr);g.addColorStop(0,`rgba(${rgb},.46)`);g.addColorStop(.55,`rgba(${rgb},.22)`);g.addColorStop(1,`rgba(${rgb},.04)`);x.fillStyle=g;x.fillRect(0,0,s.x,s.y);x.restore();x.strokeStyle=`rgba(${rgb},.95)`;x.lineWidth=3;x.beginPath();x.moveTo(cp.x,cp.y);x.lineTo(ap[0].x,ap[0].y);x.moveTo(cp.x,cp.y);x.lineTo(ap.at(-1).x,ap.at(-1).y);x.stroke();x.lineWidth=2;x.beginPath();ap.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}}
function syncTabs(){document.querySelectorAll('#pointTabs button').forEach((b,i)=>{b.classList.toggle('active',i===activeIndex);b.classList.toggle('filled',points[i].lat!==null)})}function syncControls(){const p=points[activeIndex];az.value=String(p.bearing);coords.value=p.lat===null?'Натисніть на карту':`${p.lat.toFixed(7)}, ${p.lon.toFixed(7)}`;document.querySelectorAll('#radii button').forEach(b=>b.classList.toggle('active',Number(b.dataset.r)===p.radiusKm));syncTabs();status.textContent=p.lat===null?`Точка ${activeIndex+1}: натисніть на карту або знайдіть адресу.`:`Точка ${activeIndex+1}: азимут ${p.bearing}° · радіус ${p.radiusKm} км`}
function chooseFor(i,lat,lon){const p=points[i];p.lat=lat;p.lon=lon;if(!p.marker){p.marker=L.marker([lat,lon],{draggable:true,icon:pointIcon(i)}).addTo(map);p.marker.on('dragend',e=>{const q=e.target.getLatLng();chooseFor(i,q.lat,q.lng)})}else p.marker.setLatLng([lat,lon]);drawSector(i);if(i===activeIndex)syncControls()}function drawSector(i){const p=points[i];if(p.lat===null)return;if(p.sector)map.removeLayer(p.sector);p.sector=new SectorLayer({lat:p.lat,lon:p.lon,bearing:p.bearing,distance:p.radiusKm*1000,rgb:p.color.rgb}).addTo(map);if(commonPolygonMode)setTimeout(renderCommonPolygon,0)}
function fitAll(){const all=[];points.forEach(p=>{if(p.lat===null)return;all.push(L.latLng(p.lat,p.lon));for(let o=-60;o<=60;o+=10)all.push(dest(p.lat,p.lon,p.bearing+o,p.radiusKm*1000))});if(all.length)map.fitBounds(L.latLngBounds(all).pad(.15));else status.textContent='Спочатку додайте хоча б одну точку.'}function clearPoint(i){const p=points[i];if(p.marker)map.removeLayer(p.marker);if(p.sector)map.removeLayer(p.sector);Object.assign(p,{lat:null,lon:null,bearing:0,radiusKm:3,marker:null,sector:null});syncControls();if(commonPolygonMode)renderCommonPolygon()}
document.querySelectorAll('#pointTabs button').forEach(b=>b.onclick=()=>{activeIndex=Number(b.dataset.i);syncControls()});map.on('click',e=>chooseFor(activeIndex,e.latlng.lat,e.latlng.lng));az.oninput=()=>{const v=Number(az.value);if(Number.isFinite(v)&&v>=0&&v<360){points[activeIndex].bearing=v;drawSector(activeIndex);syncControls()}};document.querySelectorAll('#radii button').forEach(b=>b.onclick=()=>{points[activeIndex].radiusKm=Number(b.dataset.r);drawSector(activeIndex);syncControls()});document.getElementById('clearBtn').onclick=()=>clearPoint(activeIndex);document.getElementById('fitBtn').onclick=fitAll;
async function searchAddress(){const q=document.getElementById('address').value.trim();if(q.length<2)return;status.textContent='Пошук…';results.innerHTML='';results.style.display='block';try{const r=await fetch('/api/geocode?q='+encodeURIComponent(q));const data=await r.json();if(!data.results?.length){results.innerHTML='<div class="result">Нічого не знайдено</div>';return}data.results.forEach(item=>{const d=document.createElement('div');d.className='result';d.innerHTML=`${item.label}<small>${item.source||'OpenStreetMap'}</small>`;d.onclick=()=>{chooseFor(activeIndex,item.lat,item.lon);map.setView([item.lat,item.lon],16);results.style.display='none'};results.appendChild(d)})}catch(e){results.innerHTML='<div class="result">Помилка пошуку</div>'}}document.getElementById('searchBtn').onclick=searchAddress;document.getElementById('address').onkeydown=e=>{if(e.key==='Enter')searchAddress()};
function polyArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}function ccw(poly){return polyArea(poly)<0?[...poly].reverse():poly}function sectorPolygon(p){const poly=[{x:p.lon,y:p.lat}];for(let o=-60;o<=60;o+=2){const q=dest(p.lat,p.lon,p.bearing+o,p.radiusKm*1000);poly.push({x:q.lng,y:q.lat})}return ccw(poly)}function cross(a,b,p){return(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x)}function lineInt(s,e,a,b){const dx1=e.x-s.x,dy1=e.y-s.y,dx2=b.x-a.x,dy2=b.y-a.y,den=dx1*dy2-dy1*dx2;if(Math.abs(den)<1e-15)return e;const t=((a.x-s.x)*dy2-(a.y-s.y)*dx2)/den;return{x:s.x+t*dx1,y:s.y+t*dy1}}function clip(subject,clipper){let out=[...subject];for(let j=0;j<clipper.length;j++){const a=clipper[j],b=clipper[(j+1)%clipper.length],input=out;out=[];if(!input.length)break;let s=input.at(-1);for(const e of input){const ei=cross(a,b,e)>=-1e-12,si=cross(a,b,s)>=-1e-12;if(ei){if(!si)out.push(lineInt(s,e,a,b));out.push(e)}else if(si)out.push(lineInt(s,e,a,b));s=e}}return out}function getCommonPolygon(){const active=points.filter(p=>p.lat!==null);if(active.length<2)return null;let inter=sectorPolygon(active[0]);for(let i=1;i<active.length&&inter.length>=3;i++)inter=clip(inter,sectorPolygon(active[i]));return inter.length>=3?inter:null}
let commonPolygonLayer=null,commonPolygonMode=false;const commonBtn=document.getElementById('commonPolygonBtn');function restore(){points.forEach((p,i)=>{if(p.lat===null)return;if(p.marker&&!map.hasLayer(p.marker))p.marker.addTo(map);drawSector(i)})}function renderCommonPolygon(){if(!commonPolygonMode)return;const poly=getCommonPolygon();if(commonPolygonLayer){map.removeLayer(commonPolygonLayer);commonPolygonLayer=null}if(!poly){commonPolygonMode=false;commonBtn.classList.remove('active');commonBtn.textContent='⬡ Спільний полігон';restore();status.textContent='Спільна область секторів відсутня.';return}points.forEach(p=>{if(p.sector&&map.hasLayer(p.sector))map.removeLayer(p.sector);if(p.marker&&map.hasLayer(p.marker))map.removeLayer(p.marker)});commonPolygonLayer=L.polygon(poly.map(p=>[p.y,p.x]),{color:'#facc15',weight:4,opacity:1,fill:false}).addTo(map);map.fitBounds(commonPolygonLayer.getBounds().pad(.2));status.textContent='Показано лише спільний полігон.'}commonBtn.onclick=()=>{if(commonPolygonMode){commonPolygonMode=false;if(commonPolygonLayer)map.removeLayer(commonPolygonLayer);commonPolygonLayer=null;restore();commonBtn.classList.remove('active');commonBtn.textContent='⬡ Спільний полігон';fitAll()}else{const poly=getCommonPolygon();if(!poly){status.textContent=points.filter(p=>p.lat!==null).length<2?'Додайте щонайменше 2 точки.':'Сектори не мають спільної області.';return}commonPolygonMode=true;commonBtn.classList.add('active');commonBtn.textContent='↩ Показати сектори';renderCommonPolygon()}};
const fullscreenBtn=document.getElementById('fullscreenBtn');function isFs(){return Boolean(document.fullscreenElement)||(tg&&Boolean(tg.isFullscreen))||document.body.classList.contains('duga-fullscreen')}function updFs(){fullscreenBtn.textContent=isFs()?'⛶ Вийти':'⛶ На весь екран';setTimeout(()=>map.invalidateSize(),80)}fullscreenBtn.onclick=async()=>{if(isFs()){document.body.classList.remove('duga-fullscreen');try{if(tg?.exitFullscreen)tg.exitFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}}else{document.body.classList.add('duga-fullscreen');try{if(tg?.requestFullscreen)tg.requestFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else tg?.expand()}catch(e){tg?.expand()}}updFs()};document.addEventListener('fullscreenchange',updFs);
map.locate({setView:false,maxZoom:16});map.on('locationfound',e=>{if(points.every(p=>p.lat===null)){chooseFor(0,e.latlng.lat,e.latlng.lng);map.setView(e.latlng,15)}});syncControls();
</script>
</body>
</html>
